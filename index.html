<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120d1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>Angely's World</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #120d1f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #3b2a6b, #120d1f 70%);
        color: #fff4d6;
        font-family: "Trebuchet MS", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 5px solid #ffd36b;
        border-radius: 12px;
        animation: tilt 2s ease-in-out infinite;
      }
      #rotate h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
      }
      #rotate p {
        margin: 0;
        opacity: 0.8;
        font-size: 15px;
      }
      @keyframes tilt {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <h1>Turn your phone sideways</h1>
      <p>Angely's World plays in landscape.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
